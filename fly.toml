app = "scalerics-crm"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/leads.db"
  # El data source de la database Tasks de Notion. No es un secreto: es
  # un id. Desde la version 2025-09-03 de la API el esquema y las queries
  # van contra el data source, no contra la database.
  NOTION_DATA_SOURCE_ID = "3ae65d94-deec-80ba-879d-000b9a303104"
  # Data source de la database Projects. Espejo de solo lectura.
  NOTION_PROJECTS_DATA_SOURCE_ID = "3ae65d94-deec-803d-8ea4-000b48070a4e"
  # Data source de la database Clientes. Espejo de solo lectura tambien: son
  # las fichas que el equipo mueve a mano en Notion, no los leads del CRM.
  NOTION_CLIENTS_DATA_SOURCE_ID = "f9265d94-deec-8296-bd14-07ce230e1017"

[[mounts]]
  source = "leads_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # La maquina no puede dormirse: Meta entrega el webhook de leads directo a
  # /api/meta/webhook y un cold start le hace timeout.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# 256mb no alcanza. El 9-9-2026 el worker de gunicorn estaba en 124 MB
# sobre 212 MB usables, con 12 MB libres, y el OOM killer se llevo uno de
# 141 MB esa madrugada. Se subio a 512 a mano y el deploy siguiente lo
# volvio a 256: el tamanio se reaplica desde este archivo en cada release,
# asi que cambiarlo por fuera no dura. Igual que paso con la region.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
