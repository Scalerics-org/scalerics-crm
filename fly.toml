app = "scalerics-crm"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/leads.db"

[[mounts]]
  source = "leads_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # /health consulta la base. Sin esto, una maquina que responde pero no puede
  # leer SQLite (volumen sin montar, disco lleno) se daba por sana.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
