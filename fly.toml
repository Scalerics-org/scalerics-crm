app = "scalerics-crm"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/leads.db"

[[mounts]]
  source = "leads_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # La maquina no puede dormirse: Meta entrega el webhook de leads directo a
  # /api/meta/webhook y un cold start le hace timeout.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
