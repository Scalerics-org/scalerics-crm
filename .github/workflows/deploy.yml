name: Deploy to Fly.io

# Deploy manual, a proposito: se dispara desde Actions > Run workflow.
#
# Estaba en "push a main", pero este repo recien se esta reconectando con su
# remoto y produccion corre una version distinta de la que hay aca. Un deploy
# automatico en el primer push saldria sin que nadie lo mire.
#
# Para volver a deploy automatico, reemplazar workflow_dispatch por:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
