name: CI

# El unico workflow que existia era el deploy: no corria tests, ni lint, ni scan
# de secretos. Ademas los tests NO PODIAN correr (main.py hacia sys.exit(1) al
# importarse), asi que 48 tests escritos nunca se ejecutaron.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Verificar que todo compila
        run: python -m compileall -q dashboard.py database.py server.py main.py routes services scripts

      - name: Tests con cobertura
        # Se mide solo el codigo fuente (incluir tests/ inflaba el numero al 34%
        # porque cada test se cubre a si mismo al 100%). Real hoy: 40%.
        #
        # El umbral es un trinquete, no una meta: lo importante es que NO BAJE. Se
        # sube cada vez que se escriben tests. Las areas mas flojas hoy son
        # routes/calendly, routes/meta y routes/wa.
        run: |
          pytest -q --cov=database --cov=routes --cov=services --cov=dashboard --cov=main \
                 --cov-report=term-missing --cov-fail-under=38

      # dashboard.py tiene el frontend embebido como string de Python, asi que ni
      # py_compile ni pytest miran el JavaScript. Un escape mal armado (jsStr
      # emitiendo '\x') hacia que el navegador no cargara el <script> entero y el
      # panel quedaba muerto, con todo el CI en verde. Este paso lo detecta.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar el JavaScript embebido
        env:
          SECRET_KEY: ci
          ANTHROPIC_API_KEY: ci
        run: python scripts/check_js.py

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita el historial completo

      # Se usa el BINARIO de gitleaks, no gitleaks-action: la action exige una
      # licencia paga para repos de organizacion (Scalerics-org lo es) y falla con
      # "missing gitleaks license". El binario es MIT y hace exactamente lo mismo.
      # Version pineada a proposito, para que un release nuevo no cambie el
      # comportamiento del CI sin que nadie lo mire.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Buscar secretos filtrados
        # --no-git escanea los ARCHIVOS tal como estan, no el historial.
        #
        # Es a proposito: el ADMIN_TOKEN que se filtro sigue vivo en commits viejos
        # y sacarlo requiere un git-filter-repo coordinado con todo el que tenga un
        # clon. Escanear el historial dejaria este job en rojo permanente hasta que
        # eso pase, y un gate que siempre falla se termina ignorando o apagando.
        #
        # Lo que este paso SI garantiza: que no entre un secreto nuevo. La purga
        # del historial esta en el checklist del PR como tarea aparte.
        #
        # --redact para no reimprimir el secreto en el log del build.
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1

      - name: Bloquear bases de datos versionadas
        # leads_backup.db (692 KB, 6 cuentas con hash y PII de 421 negocios) estuvo
        # trackeado pese a que .gitignore tiene *.db: se habia agregado con -f.
        run: |
          if git ls-files | grep -E '\.db$'; then
            echo "::error::Hay archivos .db versionados. Sacalos con git rm --cached."
            exit 1
          fi
          echo "OK: no hay bases versionadas"
