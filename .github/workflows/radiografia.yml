name: Radiografía de marketing

# ─────────────────────────────────────────────────────────────────────────────
# DOS CADENCIAS, Y LA DIFERENCIA ES PLATA.
#
# El gasto de Meta y el informe de IA no necesitan el mismo ritmo:
#
#   * Traer el gasto es gratis —es una llamada al Graph— y envejece todos los
#     días: Meta cobra a diario y además corrige los últimos días hacia atrás.
#     Va DIARIO.
#   * El informe le pide a Opus 5 que lea el dossier: ~21.000 tokens medidos,
#     del orden de USD 1–2 al mes si corre semanal. Va SEMANAL, los lunes.
#
# Por eso hay dos crons y el paso del informe tiene un `if`. Si corrieran los
# dos con la misma cadencia, o el gasto quedaría viejo seis días o el informe
# costaría siete veces más sin decir nada nuevo.
#
# Los días del cron diario excluyen el lunes a propósito (`0,2-6`): si no, el
# lunes dispararían los dos y habría una sincronización al pedo.
#
# EL INFORME SIGUE APAGADO. `RADIOGRAFIA_IA_ACTIVA` no está seteado, así que el
# paso de abajo devuelve `sin_ia` y no llama a nadie: el cron de los lunes hoy
# cuesta cero. Para prenderlo de verdad hacen falta dos cosas, en orden:
#   1. Que haya presupuesto de API.
#   2. flyctl secrets set RADIOGRAFIA_IA_ACTIVA=true -a scalerics-crm
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 11:00 UTC = 08:00 en Montevideo (UTC-3).
    # Martes a domingo: solo el gasto.
    - cron: "0 11 * * 0,2-6"
    # Lunes: el gasto y, cuando se prenda, el informe.
    - cron: "0 11 * * 1"
  workflow_dispatch:

# Dos corridas a la vez generarían dos snapshots del mismo período y pagarían el
# informe dos veces. Si el cron se solapa con una corrida a mano, la nueva espera.
concurrency:
  group: radiografia-marketing
  cancel-in-progress: false

jobs:
  radiografia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Esperar a que el CRM conteste
        # Un deploy justo a las 8:00, o un reinicio de la máquina de Fly, dejan
        # una ventana de segundos donde el CRM no contesta. No es un fallo: es
        # esperar.
        env:
          CRM: ${{ secrets.CRM_URL }}
        run: |
          set -euo pipefail
          curl -sS -f --retry 10 --retry-all-errors --retry-delay 15 \
            --max-time 30 -o /dev/null "$CRM/"

      - name: Sincronizar el gasto de Meta
        # Sin META_ADS_TOKEN esto contesta 200 y avisa que se salteó, así que no
        # rompe la corrida: el resto del dossier no depende del gasto.
        env:
          CRM: ${{ secrets.CRM_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -f --retry 5 --retry-all-errors --retry-delay 10 \
            --max-time 120 -X POST "$CRM/api/marketing/sync-insights" \
            -H "x-admin-token: $TOKEN")
          echo "sync: $RESP"

      - name: Generar la radiografía
        id: generar
        # Solo los lunes y a mano. El cron diario existe para traer el gasto, no
        # para pagar un informe por día. `github.event.schedule` trae el cron que
        # disparó la corrida, que es la única forma de distinguirlos.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '0 11 * * 1'
        env:
          CRM: ${{ secrets.CRM_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # --retry-all-errors cubre 5xx y cortes de conexión. Un 4xx no se
          # reintenta: el token mal o el endpoint que no existe no se arreglan
          # insistiendo, y ahí sí queremos que se vea en rojo.
          RESP=$(curl -sS -f --retry 5 --retry-all-errors --retry-delay 10 \
            --max-time 600 -X POST "$CRM/api/marketing/generar" \
            -H "x-admin-token: $TOKEN")
          echo "respuesta: $RESP"
          echo "$RESP" | python -c "
          import json, sys
          d = json.load(sys.stdin)
          print('status:', d.get('status'))
          # Un informe que no validó no se publica, y eso tiene que verse en
          # rojo: es la garantía de que la IA no inventa números.
          if d.get('status') == 'error_validacion':
              print('el informe no paso el validador:', d.get('error'))
              sys.exit(1)
          if d.get('status') == 'error_ia':
              print('la API fallo:', d.get('error'))
              sys.exit(1)
          for aviso in d.get('avisos') or []:
              print('aviso:', aviso)
          "

      - name: Avisar por mail si no salió
        # El mail de "workflow failed" de GitHub se pierde entre las
        # notificaciones del repo.
        if: failure()
        env:
          CRM: ${{ secrets.CRM_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -f --retry 5 --retry-all-errors --retry-delay 10 \
            --max-time 60 -X POST "$CRM/api/linkedin/fallo" \
            -H "x-admin-token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"motivo\": \"la radiografia de marketing fallo. Log: $RUN_URL\"}" \
            || echo "tampoco se pudo avisar por mail"
