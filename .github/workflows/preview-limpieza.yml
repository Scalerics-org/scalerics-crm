name: Limpiar vistas previas

# Una vista previa dormida igual paga su disco. Fly perdona la factura de la org
# personal solo si queda debajo de USD 5, así que todos los días se borran las
# de PRs cerradas que hayan quedado vivas y las de PRs sin movimiento hace más
# de 5 días. Si alguien empuja algo nuevo a la PR, la vista previa vuelve sola.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Borrar las que sobran
        run: |
          limite=$(date -u -d '5 days ago' +%s)
          for app in $(flyctl apps list --json | jq -r '.[].Name | select(startswith("scalerics-crm-pr-"))'); do
            n=${app#scalerics-crm-pr-}
            pr=$(gh api "repos/${{ github.repository }}/pulls/$n" 2>/dev/null) || pr=""
            estado=$(echo "$pr" | jq -r '.state // "closed"')
            movida=$(date -u -d "$(echo "$pr" | jq -r '.updated_at // "1970-01-01T00:00:00Z"')" +%s)
            if [ "$estado" != "open" ] || [ "$movida" -lt "$limite" ]; then
              echo "borro $app (PR $estado)"
              flyctl apps destroy "$app" --yes || true
            fi
          done
