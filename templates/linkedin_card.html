<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Raleway:wght@700&display=swap" rel="stylesheet">
<style>
  /* Marca Scalerics: navy #0f2430, azul #1796d2, verde #7fcc2a, claro #efefef.
     Sale de los assets originales (logo_full_alt.png, logo_redes.png) y del
     gradiente de marca del sitio. No usar la paleta de las demos de clientes. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 627px;
    background: #0f2430;
    font-family: 'Inter', sans-serif;
    color: #efefef;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 90px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; top: -200px; right: -140px;
    width: 660px; height: 660px; border-radius: 50%;
    background: radial-gradient(circle, rgba(23,150,210,.22) 0%, rgba(23,150,210,0) 68%);
  }
  .glow2 {
    position: absolute; bottom: -260px; right: 60px;
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(127,204,42,.10) 0%, rgba(127,204,42,0) 70%);
  }
  /* align-self: sin esto el flex column lo estira a todo el ancho y el
     alto queda ignorado. */
  .logo { height: 38px; width: auto; align-self: flex-start; margin-bottom: 40px; }
  h1 {
    font-family: 'Raleway', sans-serif; font-weight: 700;
    font-size: 62px; line-height: 1.13; letter-spacing: -.015em;
    max-width: 930px; text-wrap: balance; align-self: flex-start;
  }
  .rule {
    width: 96px; height: 4px; margin-top: 38px; border-radius: 2px;
    align-self: flex-start; flex: none;
    background: linear-gradient(90deg, #1796d2 0%, #7fcc2a 100%);
  }
  .pie {
    position: absolute; left: 90px; bottom: 54px;
    font-size: 17px; color: rgba(239,239,239,.52); letter-spacing: .05em;
  }
  /* variante */{{VARIANTE}}
</style>
</head>
